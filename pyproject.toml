[project]
name = "agent-skill-foundry-local"
version = "0.1.0"
description = "Local-first Agent Skill Foundry lifecycle prototype"
requires-python = ">=3.12"
dependencies = [
  "deepagents>=0.3", "langchain-openai>=0.3", "langchain-tavily>=0.2",
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "jinja2>=3.1",
  "python-dotenv>=1.0", "pyyaml>=6.0"
]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: opt-in tests that call the configured LLM provider"]
